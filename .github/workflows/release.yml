name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Trusted publishing needs npm >= 11.5, which ships with Node 24
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        # The action no longer exports the token, but @changesets/changelog-github reads it from the environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
